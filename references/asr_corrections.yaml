# long-doc-processor · 内置默认 ASR 错词规则(v4.16 沉淀,2026-10-12 整理)
#
# 加载顺序(scripts/_post_terms_fix.py 自动发现):
#   1. CWD 下的 asr_corrections.yaml       (项目级,最高优先级)
#   2. CWD/output/test-crv2/asr_corrections.yaml  (蒋太帅 / 智篆 / 老草等 v4.6+ 项目约定)
#   3. 本文件                            (skill 内置兜底,约 30 条)
#
# 字段说明:
#   from:    ASR 错听原文(必填)
#   to:      正确目标词(必填)
#   context: 可选;若设置,替换前必须确保该关键词出现在 from 的 ±50 字符窗口内
#
# 排序规则(脚本运行时自动):按 from 字符数降序,长词在前、短词在后,
#   避免短词误匹配(如"权占"必须在"权值"前替换)。
#
# 沉淀来源:
#   - v4.16 changelog: 石木床 / 权占 / 掀车 / 复构 / 点击力 (5 条)
#   - v4.15 changelog: 摩特图 / 点几率 / 内幕 / 气氛需求 / 推广课 / 解论
#                      加密货币 / 收获人数 / 加入段 / 高科赞 / 主视图 (11 条)
#   - v4.13 changelog: 皮气护理 / 牛仔库 / 心中式 / 带梦图 (4 条)
#   - v4.11 changelog: 数据筛毯 / 最大化作间法 / 识别确论 / 继程 / 蒸柔
#                      建国资产 / 放弹 / 相产品均头 / 相产品国际 / GGC (10 条)
#   - v4.17 phase-1.7: 演书服 / 桌教店 / 打笔 / 主途 / 燃品 / 空投产 / 汉堡国 / 空点机 (8 条)
#   - safe_replacements_2.json 已有: 心客 / 打爆(同店) / AI助力 (3 条)
#   - v4.21 玺承 2026 双十一项目: 磁包 / 控电机 / 相似品跟头 / 货源券 (4 条)
#   - 合计 45 条;按"电商场景高频 + 边界 / 智篆 / 老草 / 玺承项目实证"筛选保留全部

rules:
  # === 长词(4-7 字),极高置信度,无 context 必替换 ===
  - {from: "皮气护理",     to: "皮质护理"}
  - {from: "最大化作间法", to: "最大化筛选法"}
  - {from: "相产品均头",   to: "相似产品"}
  - {from: "相产品国际",   to: "同价位"}
  - {from: "建国资产",     to: "沉淀资产"}
  - {from: "数据筛毯",     to: "数据筛选"}
  - {from: "气氛需求",     to: "客户需求"}
  - {from: "收获人数",     to: "收货人数"}
  - {from: "识别确论",     to: "精确识别"}

  # === 中词(3 字),高频 ASR 错听 ===
  - {from: "心中式",       to: "新中式"}
  - {from: "带梦图",       to: "带门图"}
  - {from: "牛仔库",       to: "牛仔裤"}
  - {from: "推广课",       to: "推广课程"}
  - {from: "加入段",       to: "价格段"}
  - {from: "加密货币",     to: "价格带"}
  - {from: "石木床",       to: "实木床"}
  - {from: "掀车",         to: "四轮推车"}
  - {from: "摩特图",       to: "模特图"}
  - {from: "演书服",       to: "演出服"}
  - {from: "桌教店",       to: "桌角店"}
  - {from: "主视图",       to: "主图"}
  - {from: "高科赞",       to: "高客单"}
  - {from: "点击力",       to: "点击率"}
  - {from: "空投产",       to: "控投产"}
  - {from: "空点机",       to: "控点机"}

  # === 短词(2 字),可能误匹配,部分带 context 保护 ===
  - {from: "权占",         to: "全站"}
  - {from: "点几率",       to: "点击率"}
  - {from: "汉堡国",       to: "汉堡包"}
  - {from: "心客",         to: "新客"}
  - {from: "打笔",         to: "打比"}
  - {from: "放弹",         to: "放量"}
  - {from: "蒸柔",         to: "蒸馏"}
  - {from: "继程",         to: "决策"}
  - {from: "燃品",         to: "产品"}
  - {from: "主途",         to: "主图"}
  - {from: "复构",         to: "复购"}
  - {from: "解论",         to: "结论"}
  - {from: "内幕",         to: "类目"}

  # === 带 context 保护(避免误伤) ===
  - {from: "打爆",         to: "打散",     context: "同店"}
  - {from: "GGC",          to: "GGV"}
  - {from: "AI助力",       to: "AI 助力"}

  # === v4.22 玺承 2026 双十一备战项目(电商运营/直通车/会员场景) ===
  # 直通车相关 — 启用 phonetic:true 捕获 ASR 同音变体(如 恐点鸡/次包)
  - {from: "磁包",         to: "词包"}                                                # 智能计划/趋势计划 词汇包
  - {from: "控点击",       to: "控点击",   context: "投放|计划|出价|成交|板块|对不对", phonetic: true} # 同: 控电机 / 恐点鸡
  - {from: "相似品跟投",   to: "相似品跟投", phonetic: true}                            # 关键词计划场景: 同 相似品跟头
  # 会员/CRM 相关
  - {from: "会员券",       to: "会员券",   context: "VIP|会员|权益|券",  phonetic: true}   # 同: VIP货源券
  - {from: "滋损",         to: "资损"}                                              # 资金损失(滋 zī = 资 zī, 字面错听)
  # 高频 ASR 同音混淆兜底(phonetic 模式):
  - {from: "词包",         to: "词包",     phonetic: true}                              # 同: 次包 / 茨包 / 磁包
  - {from: "主图",         to: "主图",     phonetic: true}                              # 同: 主途 / 主视图(短语) / 猪图
  - {from: "点击率",       to: "点击率",   phonetic: true}                              # 同: 点击力 / 点几率 / 电击率
  - {from: "控投产",       to: "控投产",   phonetic: true}                              # 同: 空投产 / 控从产
  - {from: "控点机",       to: "控点机"}                                              # 同: 空点机 / 恐点鸡(被控点击 phonetic覆盖)

# 注:本文件由 scripts/_post_terms_fix.py 自动加载;修改后无需重装 skill。
# 项目级覆盖:cp 本文件到 output/test-crv2/asr_corrections.yaml 后编辑
